spring.application.name=vinoth-mart

# Railway will provide the PORT when deployed.
# 8080 is used when running locally.
server.port=${PORT:8080}

# =========================================================
# MYSQL DATABASE
# Local PC:
#   localhost:3306/vinoth_mart
#
# Railway:
#   MYSQLHOST
#   MYSQLPORT
#   MYSQLDATABASE
#   MYSQLUSER
#   MYSQLPASSWORD
# =========================================================

spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:vinoth_mart}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata

spring.datasource.username=${MYSQLUSER:root}

spring.datasource.password=${MYSQLPASSWORD:admin}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================================
# DATABASE INITIALIZATION
# =========================================================

spring.sql.init.mode=always

spring.sql.init.schema-locations=classpath:schema.sql

spring.sql.init.data-locations=classpath:data.sql

spring.sql.init.continue-on-error=false

# =========================================================
# SPRING SETTINGS
# =========================================================

spring.jpa.open-in-view=false

spring.jackson.serialization.indent-output=true